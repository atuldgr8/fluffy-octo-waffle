:root{
  --tomato:#E0391F; --tomato-deep:#A9261A; --tomato-soft:#FBE1DA;
  --stem:#66702B; --stem-soft:#E8EDCD;
  --paper:#FBF3EE; --card:#FFFFFF; --ink:#2B1510; --ink-soft:#7A5B52; --line:#EEDDD5;
  --display:"Satoshi","Arial Black",system-ui,sans-serif;
  --body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(0.23,1,0.32,1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tomato);outline-offset:2px;border-radius:12px}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:900;font-size:42px;letter-spacing:-0.035em;line-height:1}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-top:8px;color:var(--ink-soft)}
.journey{display:flex;gap:4px;flex-wrap:wrap}
.journey span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);background:var(--card);transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease)}
.journey span.on{background:var(--tomato);border-color:var(--tomato);color:#fff}
.stage{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:780px){.stage{grid-template-columns:minmax(0,1fr)}.phone{margin:0 auto}}

.phone{width:100%;max-width:360px;height:730px;border-radius:48px;background:var(--ink);padding:10px}
.screen{height:100%;border-radius:39px;background:var(--paper);overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;padding:12px 26px 4px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.view{flex:1;overflow-y:auto;padding:8px 18px 18px;display:flex;flex-direction:column;gap:12px}
.view::-webkit-scrollbar{width:0}
h1,h2{font-family:var(--display);font-weight:900;letter-spacing:-0.025em;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.06}
h2{font-size:19px;line-height:1.15}
.sub{color:var(--ink-soft);font-size:13px;margin:0}
.lab{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0}
.card{background:var(--card);border-radius:20px;padding:14px;border:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:18px;background:var(--tomato);color:#fff;font-weight:500;font-size:15px;transition:transform .16s var(--ease),background-color .2s var(--ease)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:active,.press:active{transform:scale(0.97)}
.press{transition:transform .16s var(--ease)}
.ico{width:18px;height:18px;flex-shrink:0}
.tabs{display:flex;justify-content:space-around;padding:10px 12px 16px;border-top:1px solid var(--line);background:var(--card)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink-soft);padding:4px 10px;transition:color .2s ease}
.tabs button.on{color:var(--tomato)}
.check{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);flex-shrink:0;font-size:12px;font-weight:700;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.check.done{background:var(--stem);border-color:var(--stem);color:#fff}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--stem);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;flex-shrink:0}
.label-box{background:var(--tomato);color:#fff;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.label-box .sub{color:#FFD8CF}
.straw{position:absolute;right:20px;top:-8px;width:10px;height:60px;border-radius:5px;background:var(--stem);transform:rotate(14deg)}
.jar{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);text-align:left;width:100%;transition:border-color .2s ease,transform .16s var(--ease)}
.jar.on{border-color:var(--tomato)}
.toast{position:absolute;left:12px;right:12px;top:44px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;font-size:13px;z-index:5}
.phases{display:flex;gap:4px}
.phases i{height:8px;border-radius:4px;background:var(--line);transition:background-color .3s ease}
.knob{display:flex;gap:6px}
.knob button{flex:1;padding:9px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .16s var(--ease),background-color .2s ease,border-color .2s ease}
.knob button:active{transform:scale(0.97)}
.knob button.on{background:var(--tomato-soft);border-color:var(--tomato);color:var(--tomato-deep)}
input[type=range]{width:100%;accent-color:var(--tomato)}
.num{font-variant-numeric:tabular-nums}
.dial{touch-action:none;cursor:grab;display:block;margin:0 auto;user-select:none}
.dial.dragging{cursor:grabbing}
.dface{transform-origin:100px 100px;transition:transform .3s var(--ease)}
.dragging .dface{transition:none}
.dtxt{font-family:var(--display);font-weight:900}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.list>*{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;text-align:left;width:100%}
.list>*+*{border-top:1px solid var(--line)}
.switch{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex-shrink:0;transition:background-color .2s ease}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch.on{background:var(--stem)}
.switch.on::after{transform:translateX(18px)}
.splash{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--ink);z-index:6;cursor:pointer}
.splash .lab{color:#FFD8CF}

.hdr{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;min-height:40px}
.hdr b{text-align:center;font-size:15px}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:transform .16s var(--ease)}
.back:active{transform:scale(0.95)}
.tl{display:flex;flex-direction:column;gap:10px}
.tl-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.tl-time{font-size:12px;font-weight:500;color:var(--ink-soft);padding-top:14px;font-variant-numeric:tabular-nums}
.tl-row.done .card{opacity:.6}
.pill{font-size:11px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--stem-soft);color:var(--stem);white-space:nowrap}
.pill.red{background:#fff;color:var(--tomato-deep)}
.glabel{position:absolute;left:12px;top:10px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;opacity:0;pointer-events:none}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.cubebox{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:10px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px}
#cube3d{width:100%;height:290px;position:relative;touch-action:pan-y}
#cube3d canvas{display:block}
.cubestate{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.hint{font-size:12px;color:var(--ink-soft);margin:0}
.gestures{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gestures button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;font-weight:500;font-size:14px;transition:transform .16s var(--ease),border-color .2s ease}
.gestures button span{font-weight:400;font-size:12px;color:var(--ink-soft)}
.gestures button:active{transform:scale(0.97)}
@media (hover:hover) and (pointer:fine){.gestures button:hover{border-color:var(--tomato)}}
.gestures button.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.gestures button.main span{color:#D9C4BC}
.caption{background:var(--tomato-soft);border-radius:18px;padding:14px 16px;font-size:14px;min-height:52px;color:var(--tomato-deep)}
.util{display:flex;gap:8px;flex-wrap:wrap}
.util button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;transition:transform .16s var(--ease),background-color .2s ease}
.util button:active{transform:scale(0.97)}
.util button.on{background:var(--stem);color:#fff;border-color:var(--stem)}
@media (prefers-reduced-motion:reduce){.dface,.journey span,.switch::after{transition:none}}

function loop(now){

function cubeState(){

function go(s){S.s=s;S._r=true;if(s==='live'){S.ph=0;S.cooking=true;}if(s==='plate'){S.cooking=false;S.rev=false;S.g=Math.round(S.m*0.75/5)*5;}render(true);}

const tomato=c=>`<svg width="170" height="156" viewBox="0 0 170 160" aria-hidden="true" style="display:block;margin:2px auto"><ellipse cx="85" cy="92" rx="70" ry="60" fill="${c}"/><ellipse cx="60" cy="74" rx="16" ry="9" fill="#fff" opacity=".25"/><path d="M85 34 l-22 -8 l14 14 l-20 6 l22 2 l6 -16 l6 16 l22 -2 l-20 -6 l14 -14z" fill="#66702B"/><rect x="82" y="16" width="6" height="18" rx="3" fill="#66702B"/></svg>`;
const juiceBox=w=>`<svg width="${w}" viewBox="0 0 140 250" aria-hidden="true"><rect x="64" y="2" width="12" height="70" rx="2" fill="#2E8B3E"/><rect x="64" y="2" width="12" height="8" fill="#247233"/><path d="M8 64 L30 46 L30 72 Z" fill="#C42F18"/><path d="M132 64 L110 46 L110 72 Z" fill="#C42F18"/><path d="M8 64 L18 56 L22 70 Z" fill="#7A1A10"/><path d="M132 64 L122 56 L118 70 Z" fill="#7A1A10"/><path d="M30 48 H110 L118 74 V228 Q118 240 106 240 H34 Q22 240 22 228 V74 Z" fill="#E0391F"/><path d="M30 48 L22 74 H118 L110 48 Z" fill="#EC5A3E"/><path d="M118 74 L130 62 V226 Q130 234 122 238 L118 240 Z" fill="#A9261A"/><path d="M110 48 L130 62 L118 74 Z" fill="#C42F18"/><path d="M22 228 L42 212 M118 228 L98 212" stroke="#B82C16" stroke-width="2"/><path d="M70 92 c-14 -6 -26 -2 -32 6 c10 -2 18 0 24 6 c-6 6 -8 14 -6 22 c6 -8 10 -12 14 -14 c4 2 8 6 14 14 c2 -8 0 -16 -6 -22 c6 -6 14 -8 24 -6 c-6 -8 -18 -12 -32 -6z" fill="#7DBE3A"/><text x="70" y="172" text-anchor="middle" class="dtxt" font-size="18" fill="#fff">tomatone</text><text x="70" y="190" text-anchor="middle" font-size="7" font-family="Roboto" letter-spacing="1.2" fill="#FFD8CF">MUSICAL TIMER</text><text x="70" y="226" text-anchor="middle" font-size="9" font-family="Roboto" fill="#FFB9A8">90 min</text></svg>`;
const hdr=(t,act)=>`<div class="hdr"><button class="back" data-act="${act}" aria-label="Back">${I.back}</button><b>${t}</b><span></span></div>`;
const knob=()=>`<div class="knob" role="group" aria-label="Heat">${HEAT.map((h,i)=>`<button data-heat="${i+1}" class="${S.heat===i+1?'on':''}" aria-pressed="${S.heat===i+1}"><span>${I.flame.repeat(i+1)}</span>${h}</button>`).join('')}</div>`;

function dial(){const R=78;let ticks='';for(let i=0;i<36;i++){const t=-i/36*2*Math.PI,l=i%6===0?10:5;ticks+=`<line x1="${(100+92*Math.sin(t)).toFixed(1)}" y1="${(100-92*Math.cos(t)).toFixed(1)}" x2="${(100+(92-l)*Math.sin(t)).toFixed(1)}" y2="${(100-(92-l)*Math.cos(t)).toFixed(1)}" stroke="#2B1510" stroke-width="${i%6===0?2:1}"/>`;}
 const labs=[0,30,60,90,120,150].map(v=>{const t=-v/180*2*Math.PI,x=100+70*Math.sin(t),y=100-70*Math.cos(t);return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" font-size="11" class="dtxt" fill="#7A5B52" transform="rotate(${-v*2} ${x.toFixed(1)} ${y.toFixed(1)})">${v}</text>`;}).join('');
 return `<svg class="dial" id="dial" width="236" height="236" viewBox="-6 -6 212 212" role="slider" tabindex="0" aria-label="Session length. Drag to turn." aria-valuemin="5" aria-valuemax="180" aria-valuenow="${S.m}" aria-valuetext="${fmt(S.m)}">
 <circle cx="100" cy="100" r="99" fill="#2B1510"/>
 <g class="dface" id="dface" style="transform:rotate(${S.m*2}deg)"><circle cx="100" cy="100" r="95" fill="#fff"/><path id="wedge" d="${wedgeD(S.m)}" fill="#E0391F"/>${ticks}${labs}</g>
 <path d="M100 -4 L92 10 H108 Z" fill="#2B1510"/>
 <circle cx="100" cy="100" r="36" fill="#2B1510"/><rect x="96" y="56" width="8" height="30" rx="4" fill="#2B1510"/>
 <text id="dnum" x="100" y="100" text-anchor="middle" font-size="20" class="dtxt" fill="#fff">${S.m}</text><text x="100" y="116" text-anchor="middle" font-size="9" font-family="Roboto" fill="#D9C4BC">minutes</text></svg>`;}
function wedgeD(m){const R=78,f=Math.min(m/180,0.9999),a=f*2*Math.PI,x=100-R*Math.sin(a),y=100-R*Math.cos(a);return `M100 100 L100 ${100-R} A${R} ${R} 0 ${f>0.5?1:0} 0 ${x.toFixed(1)} ${y.toFixed(1)} Z`;}
function updateDial(){const d=$('dial');if(!d)return;$('dface').style.transform=`rotate(${S.m*2}deg)`;$('wedge').setAttribute('d',wedgeD(S.m));$('dnum').textContent=S.m;d.setAttribute('aria-valuenow',S.m);d.setAttribute('aria-valuetext',fmt(S.m));const e=$('endT');if(e)e.textContent=endTime();}
function endTime(){const d=new Date(2026,10,10,16,30+S.m);return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}).toLowerCase();}
function bindDial(){const d=$('dial');if(!d)return;let drag=false,a0=0,m0=0;
 const ang=e=>{const r=d.getBoundingClientRect();return Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2));};
 d.onpointerdown=e=>{if(drag)return;drag=true;d.classList.add('dragging');d.setPointerCapture(e.pointerId);a0=ang(e);m0=S.m;};
 d.onpointermove=e=>{if(!drag)return;let da=ang(e)-a0;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;a0=ang(e);m0+=da/(2*Math.PI)*180;m0=Math.max(5,Math.min(180,m0));const m=Math.round(m0/5)*5;if(m!==S.m){S.m=m;blip(1400,0.02,0.07);updateDial();}};
 const end=()=>{drag=false;d.classList.remove('dragging');};d.onpointerup=end;d.onpointercancel=end;
 d.onkeydown=e=>{const up=['ArrowRight','ArrowUp'].includes(e.key),dn=['ArrowLeft','ArrowDown'].includes(e.key);if(!up&&!dn)return;e.preventDefault();S.m=Math.max(5,Math.min(180,S.m+(up?5:-5)));updateDial();};}

  ['Time passes','Demo: next phase',()=>{if(S.ph<2){S.ph++;say(S.ph===1?'Simmer. A steady beat that stays out of your way. Nothing changes for a long while.':'Boil. Faster, brighter tracks, plus a soft tick underneath. You feel the end coming without looking.');}else{go('plate');say('Plate. The closing track resolves, right on time.');}},true],
  ['Shake','Swap jar',()=>{cubeAnim('shake');S.jar=(S.jar+1)%J.length;say('Swapped to '+J[S.jar].n+'. Same phase, same clock.');}],
  ['Tilt left','Less heat',()=>{cubeAnim('left');S.heat=Math.max(1,S.heat-1);say('Heat down to '+HEAT[S.heat-1].toLowerCase()+'. Tomatone remembers this for next time.');}],
  ['Tilt right','More heat',()=>{cubeAnim('right');S.heat=Math.min(3,S.heat+1);say('Heat up to '+HEAT[S.heat-1].toLowerCase()+'.');}],
  ['Double tap','How much is left?',()=>{cubeAnim('tap');say('The beat plays its current pace for two seconds. Faster means closer.');}],
  ['Pick up phone','Distraction',()=>{showLabel('Phone picked up');if(S.nudge){S.dip=true;toast('Music dipped. Back to the thesis?');say('The music dips softly instead of buzzing you. Put the phone down and it comes back.');setTimeout(()=>{S.dip=false;},2600);}else say('Refocus nudge is off in settings.');}],
  ['Flip over','End early',()=>{cubeAnim('flip');S.m=Math.round(S.m*0.9/5)*5;setTimeout(()=>{go('plate');},1300);say('Ended early. The current track fades into the closer.');}]];
 if(S.s==='plate')return [['Put it on the dock','Charges, goes quiet',()=>{showLabel('Docked');S.cooking=false;go('notebook');say('Docked. Your guess is in the notebook.');}]];
 return [];
}
let G=[];
function renderGestures(){G=gestures();$('gestures').innerHTML=G.length?G.map((g,i)=>`<button class="${g[3]?'main':''}" data-g="${i}">${g[0]}<span>${g[1]}</span></button>`).join(''):'<p class="sub">No cube action here. Use the phone.</p>';}
function runG(i){S._r=false;G[i][2]();if(!S._r){if(S.s==='setup'){updateDial();cubeState();}else render(false);}renderGestures();}

function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('screenEl').appendChild(el);if(!reduce)el.animate([{transform:'translateY(-110%)',opacity:0},{transform:'translateY(0)',opacity:1}],{duration:260,easing:'cubic-bezier(0.23,1,0.32,1)'});setTimeout(()=>{const a=el.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-30%)'}],{duration:160,easing:'ease-out',fill:'forwards'});a.onfinish=()=>el.remove();},2400);}

/* ---------- render ---------- */
function render(anim){
 $('journey').innerHTML=STEPS.map((t,i)=>`<span class="${i===stepIndex()?'on':''}">${t}</span>`).join('');
 const v=$('view');v.innerHTML=screen();
 $('tabsSlot').innerHTML=['kitchen','notebook'].includes(S.s)||(S.s==='pantry'&&S.from!=='setup')?tabs(S.s):'';
 if(anim){v.scrollTop=0;if(!reduce)[...v.children].slice(0,8).forEach((c,i)=>c.animate([{opacity:0,transform:'translateY(8px)',filter:'blur(2px)'},{opacity:1,transform:'translateY(0)',filter:'blur(0)'}],{duration:260,delay:i*40,easing:'cubic-bezier(0.23,1,0.32,1)',fill:'backwards'}));}
 renderGestures();if(C3.ok||!window.THREE)cubeState();bindDial();
 const gr=$('guess');if(gr)gr.oninput=()=>{S.g=+gr.value;$('gv').textContent=fmt(S.g);};
}
function splash(){const el=document.createElement('div');el.className='splash';el.id='splash';el.innerHTML=`${juiceBox(190)}<p class="lab" style="color:var(--ink-soft)">Tap to open</p>`;$('screenEl').appendChild(el);
 if(!reduce)el.firstElementChild.animate([{transform:'translateY(10px) scale(0.96)',opacity:0},{transform:'none',opacity:1}],{duration:500,easing:'cubic-bezier(0.23,1,0.32,1)'});
 const leave=()=>{if(S.s!=='splash')return;go('onboard');say('Start on the phone. Pair the cube first.');const a=el.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-out',fill:'forwards'});a.onfinish=()=>el.remove();};
 el.onclick=leave;setTimeout(leave,2200);}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-g]');if(g){runG(+g.dataset.g);return;}
 const t=e.target.closest('[data-go]');if(t){S.from='kitchen';go(t.dataset.go);return;}
 const j=e.target.closest('[data-jar]');if(j){S.jar=+j.dataset.jar;say(J[S.jar].n+' is on the stove.');render(false);return;}
 const h=e.target.closest('[data-heat]');if(h){S.heat=+h.dataset.heat;say('Heat set to '+HEAT[S.heat-1].toLowerCase()+'. On the cube, tilt left or right.');if(S.s==='setup'){const st=$('view').scrollTop;render(false);$('view').scrollTop=st;}else render(false);return;}
 const tg=e.target.closest('[data-tog]');if(tg){const k=tg.dataset.tog;S[k]=!S[k];const st=$('view').scrollTop;render(false);$('view').scrollTop=st;return;}
 const rm=e.target.closest('[data-rm]');if(rm){S.seeds.splice(+rm.dataset.rm,1);render(false);return;}
 const a=e.target.closest('[data-act]');if(!a)return;
 ({pair:()=>{S.paired=true;say('On the cube: hold the top button for 5 seconds. Paired.');render(false);},
   music:()=>{S.music=!S.music;render(false);},cal:()=>{S.cal=!S.cal;render(false);},
   toKitchen:()=>{if(!S.paired){say('Pair the cube first. Tap step 1, or hold the button on the cube.');return;}go('kitchen');say('Home. Your next session waits here.');},
   settings:()=>{S.pairStage=0;go('settings');say('Account, your cube, and session defaults.');},
   repair:()=>{S.pairStage=0;go('pair');say('Re-pairing. Hold the cube\'s button for 5 seconds.');},
   pairNew:()=>{S.pairStage=0;go('pair');say('New cube. Hold its button for 5 seconds.');},
   forget:()=>{toast('Forget this cube? Its sessions stay in your notebook.');},
   pairSearch:()=>{S.pairStage=1;render(false);say('Searching. The button keeps blinking until it\'s found.');},
   pairPick:()=>{S.pairStage=2;showLabel('Chime');blip(880,0.4,0.2);render(false);say('Paired. The cube chimes once.');},
   guide:()=>{S.guide=!S.guide;const st=$('view').scrollTop;render(false);$('view').scrollTop=st;},
   new:()=>{go('setup');say('Turn the dial, or lift the cube and rock it. Both stay in sync.');},
   pickJar:()=>{S.from='setup';go('pantry');say('Pick which jar to cook with.');},
   backSetup:()=>go('setup'),
   toSplash:()=>{S.s='splash';render(false);splash();},
   leaveLive:()=>{S.cooking=true;const ph=S.ph;go('kitchen');S.ph=ph;say('The session keeps cooking. The cube carries on playing.');},
   backLive:()=>{const ph=S.ph;S.s='live';S._r=true;render(true);S.ph=ph;say('Back to the session.');},toPantry:()=>go('pantry'),
   newjar:()=>{go('newjar');say('Seed one to three songs, or import a playlist.');},
   addSeed:()=>{const pool=['Graph paper','Night bus home','Index cards'];S.seeds.push(pool[S.seeds.length]);render(false);},
   importPl:()=>{toast('Pick a playlist from your music. It becomes one jar.');},
   seal:()=>{if(!S.seeds.length){$('jarErr').textContent='Add at least one seed song to seal the jar.';return;}J.push({n:'Late-night essay',d:S.seeds.length+' seed songs',c:'#A9261A',t:[...S.seeds,'Similar track','Similar track','Closing track']});S.jar=J.length-1;S.seeds=['Rain on tin roofs','Late library'];go('pantry');say('Jar sealed and on the shelf.');},
   reveal:()=>{S.rev=true;say('Guess first, then the truth. That order keeps the notebook honest.');render(false);},
   toNotebook:()=>{S.from='kitchen';go('notebook');say('Your guesses, tracked over time.');}
 })[a.dataset.act]?.();
});
$('soundBtn').onclick=()=>{S.sound=S0.sound=!S.sound;if(S.sound)actx()?.resume();$('soundBtn').textContent='Sound demo: '+(S.sound?'on':'off');$('soundBtn').classList.toggle('on',S.sound);cubeState();say(S.sound?'Sound on. A low beat stands in for your music, and Boil adds a soft tick on top.':'Sound off.');};
$('silentBtn').onclick=()=>{S.silent=!S.silent;cubeAnim('silent');$('silentBtn').classList.toggle('on',S.silent);cubeState();say(S.silent?'Silent mode. The same curve arrives as vibrations that quicken.':'Sound mode back on.');};
$('volBtn').onclick=()=>{S.vol=S.vol>=10?2:S.vol+2;$('vol').textContent=S.vol;cubeAnim('spin');say('Spun flat on the desk. Volume '+S.vol+'.');};
$('restartBtn').onclick=()=>{stopBeat();S=fresh();$('silentBtn').classList.remove('on');document.getElementById('splash')?.remove();render(false);splash();say('Tap the juice box to open the app.');};
init3D();render(false);splash();
</script>
